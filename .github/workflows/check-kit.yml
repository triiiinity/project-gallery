# Checks the Kit sign-up form and the live site when the check script changes.
name: check kit
on:
  push:
    branches: [main]
    paths: ["scripts/check-kit.mjs"]
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: sleep 120   # give Cloudflare time to publish the push
      - run: node scripts/check-kit.mjs
      - run: |
          git config user.name "Claude"
          git config user.email "noreply@anthropic.com"
          git add scripts/check-kit.log
          git commit -m "Kit sign-up check" -m "Co-Authored-By: Claude Opus 5.5 <noreply@anthropic.com>" || echo "nothing to save"
          git pull -q --rebase && git push
